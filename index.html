<!DOCTYPE html>
<html>
    <head>
        <link rel="stylesheet" href="style.css">
        <title>Button Clicker: Level 1</title>
    </head>
    <body>
        <header>
            <a href="levels.html" class="nav">Levels</a>
        </header>
        <div id="top">
            <h1>Button Clicker: Level 1</h1>
            <h2>Click the button more than 300 times in one minute!
            </h2>
        </div>
        <div>
            <h2 class="heading">Timer</h2>
            <h3 id="timer">60</h3>
            <!--<video width="320" height="240" controls>
                <source src="Countdown.mp4.mp4" type="video/mp4">
                Your browser does not support the video type.
            </video>-->
            <button class="startTimer" id="startTimer">Start Timer</button>
        </div>
        <div>
            <h2 class="score">Score: <span id="score">0</span></h2>
            <button class="click" id="click" disabled>Click</button>
            <div id="resultDiv" class="hidden">
                <h2>Result</h2>
                <h4 id="result"></h4>
            </div>
        </div>
        <script src="script.js"></script>
    </body>
</html>
